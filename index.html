<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글로벌 공지 시간 변환 및 자동 영문 번역기</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --box-bg: #ffffff;
            --border: #cbd5e1;
            --text-main: #1e293b;
            --text-sub: #475569;
            --accent: #0ea5e9;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px; 
            margin: 0; 
        }
        
        /* 2단 대시보드 레이아웃 */
        .app-grid {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 24px;
            max-width: 1600px;
            margin: 0 auto;
            height: calc(100vh - 48px);
            min-height: 800px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            margin-bottom: 8px; 
            border-bottom: 2px solid #e2e8f0; 
            padding-bottom: 16px; 
        }
        
        .header-title h1 { margin: 0; font-size: 22px; color: #0f172a; font-weight: 800; }
        .header-title p { margin: 6px 0 0 0; font-size: 13px; color: var(--text-sub); }
        .today-badge { 
            background-color: var(--accent); 
            color: white; 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
            box-shadow: 0 2px 6px rgba(14, 165, 233, 0.2);
        }
        
        .card { 
            background: var(--box-bg); 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            padding: 24px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }

        .card.flex-fill { flex: 1; }
        
        .card-section-title { 
            font-weight: 800; 
            font-size: 15px; 
            color: #1e293b; 
            margin-bottom: 16px; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 16px; 
        }
        
        .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 13px; font-weight: 700; color: var(--text-sub); }
        
        .input-control { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            color: var(--text-main); 
            background-color: #f8fafc; 
            outline: none; 
            transition: all 0.2s;
        }
        
        .input-control:focus { 
            background-color: #fff;
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); 
        }

        .time-select-container { display: flex; gap: 8px; align-items: center; }
        
        /* 결과 박스 스타일 */
        .result-item { margin-bottom: 16px; }
        .result-item:last-child { margin-bottom: 0; }
        .result-label { font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between;}
        .result-wrapper { 
            display: flex; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            overflow: hidden; 
            background: #f8fafc; 
        }
        
        .result-text { 
            flex: 1; 
            padding: 12px; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 14px; 
            font-weight: 700; 
            color: var(--primary); 
            display: flex; 
            align-items: center; 
            overflow-x: auto;
            white-space: nowrap;
        }
        
        .btn-copy { 
            background: #cbd5e1; 
            color: #1e293b; 
            border: none; 
            padding: 0 16px; 
            font-size: 13px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        
        .btn-copy:hover { background: #94a3b8; color: white; }
        .btn-copy:active { background: #64748b; }
        
        /* 우측 에디터 영역 */
        .editor-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            min-height: 0; /* flex 버그 방지 */
        }
        
        .label-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .label-title { font-weight: 800; font-size: 15px; color: #1e293b; }
        
        .btn-group { display: flex; gap: 8px; }
        
        .badge-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-sub);
            transition: all 0.15s;
        }
        
        .badge-btn:hover { background: #e2e8f0; color: #0f172a; border-color: #94a3b8; }
        .badge-btn:active { background: #cbd5e1; }
        
        .editor-textarea {
            width: 100%;
            flex: 1;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            outline: none;
            background-color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        .editor-textarea:focus {
            border-color: var(--primary);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .editor-textarea.readonly {
            background-color: #f8fafc;
            color: #334155;
        }
        
        /* 중앙 번역 액션 버튼 */
        .translate-action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 12px;
        }
        
        .translate-notice {
            font-size: 12px;
            color: #64748b;
            font-weight: 700;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 20px;
        }
        
        .btn-translate {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 60%;
            justify-content: center;
        }
        
        .btn-translate:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.3); }
        .btn-translate:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
        .btn-translate:disabled { background-color: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>
</head>
<body>

<div class="app-grid">
    
    <!-- 좌측 패널: 시간 변환기 -->
    <div class="panel">
        <div class="header-container">
            <div class="header-title">
                <h1>🌐 글로벌 공지 시간 변환기</h1>
                <p>한국 기준(KST) 일시를 권역별 글로벌 시간대로 자동 변환합니다.</p>
            </div>
            <div id="todayDate" class="today-badge">계산 중...</div>
        </div>

        <div class="card">
            <div class="card-section-title">🕒 공지 일정 입력 (KST 기준)</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="noticeDate">점검 기준 날짜 (KST)</label>
                    <input type="date" id="noticeDate" class="input-control" onchange="convertTime()">
                </div>
                <div class="form-group">
                    <label>시작 시간</label>
                    <div class="time-select-container">
                        <select id="startHour" class="input-control" onchange="convertTime()"></select>
                        <select id="startMin" class="input-control" onchange="convertTime()"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>종료 시간</label>
                    <div class="time-select-container">
                        <select id="endHour" class="input-control" onchange="convertTime()"></select>
                        <select id="endMin" class="input-control" onchange="convertTime()"></select>
                    </div>
                </div>
                
                <div class="form-group full-width" style="margin-top: 8px;">
                    <label for="utcOffset">타겟 권역 (One-Build 서비스용)</label>
                    <select id="utcOffset" class="input-control" onchange="convertTime()">
                        <option value="8" selected>아시아 권역 (UTC+8) - 대만, 홍콩, 싱가포르 등</option>
                        <option value="9">한국/일본 권역 (UTC+9)</option>
                        <option value="7">동남아 권역 (UTC+7) - 태국, 인도네시아 등</option>
                        <option value="-5">북미 권역 (UTC-5) - EST</option>
                        <option value="-8">북미 권역 (UTC-8) - PST</option>
                        <option value="2">유럽 권역 (UTC+2) - CEST</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card flex-fill">
            <div class="card-section-title">📋 변환 결과</div>
            
            <div class="result-item">
                <div class="result-label">🇰🇷 한국 표준시 (KST)</div>
                <div class="result-wrapper">
                    <div id="kstResult" class="result-text">-</div>
                    <button class="btn-copy" onclick="copyText('kstResult')">복사</button>
                </div>
            </div>
            
            <div class="result-item">
                <div class="result-label">🌍 글로벌 기준 (UTC+0 / Steam)</div>
                <div class="result-wrapper">
                    <div id="utcZeroResult" class="result-text">-</div>
                    <button class="btn-copy" onclick="copyText('utcZeroResult')">복사</button>
                </div>
            </div>
            
            <div class="result-item">
                <div class="result-label" id="targetLabel">🌏 타겟 권역 (UTC+8)</div>
                <div class="result-wrapper">
                    <div id="utcResult" class="result-text">-</div>
                    <button class="btn-copy" onclick="copyText('utcResult')">복사</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 우측 패널: 다이렉트 영문 번역 워크스페이스 -->
    <div class="panel">
        <div class="card flex-fill" style="padding: 24px;">
            <div class="card-section-title">📝 자동 영문 번역 워크스페이스</div>
            
            <!-- 원문(국문) 입력 -->
            <div class="editor-group">
                <div class="label-header">
                    <span class="label-title">원본 공지 (한국어)</span>
                    <div class="btn-group">
                        <button type="button" class="badge-btn" onclick="insertTimeToEditor('KST')">KST 삽입</button>
                        <button type="button" class="badge-btn" onclick="insertTimeToEditor('UTC0')">UTC+0 삽입</button>
                        <button type="button" class="badge-btn" onclick="insertTimeToEditor('UTCN')" style="background-color: #e0f2fe; color: #0284c7; border-color: #bae6fd;">타겟 UTC 삽입</button>
                    </div>
                </div>
                <textarea id="sourceNotice" class="editor-textarea">안녕하세요. 린 크로니클 지원팀입니다.

게임 업데이트 및 서버 안정화를 위한 정기 점검이 진행될 예정입니다.
아래의 점검 일정을 참고해 주시기 바랍니다.

■ 점검 일정
- [점검시간삽입]

■ 주요 업데이트 내역
1. 신규 영웅 추가
2. 시스템 안정화 및 버그 수정

점검 진행 상황에 따라 시간이 변동될 수 있으며, 변동 시 공지를 통해 안내해 드리겠습니다.
항상 린 크로니클을 사랑해 주셔서 감사합니다.</textarea>
            </div>
            
            <!-- 번역 액션 -->
            <div class="translate-action-area">
                <div class="translate-notice">💡 '린 크로니클'은 영문 번역 시 'Lyn Chronicle'로 자동 보정됩니다.</div>
                <button id="translateBtn" class="btn-translate" onclick="translateToEnglish()">
                    🇬🇧 영문으로 자동 번역하기 ⬇️
                </button>
            </div>
            
            <!-- 결과(영문) -->
            <div class="editor-group">
                <div class="label-header">
                    <span class="label-title">글로벌 공지 (영어)</span>
                    <button class="badge-btn" onclick="copyText('targetNotice')" style="background-color: #1e293b; color: white;">📋 최종 결과 복사</button>
                </div>
                <textarea id="targetNotice" class="editor-textarea readonly" placeholder="위의 [영문으로 자동 번역하기] 버튼을 누르면 결과가 출력됩니다. 직접 수정도 가능합니다."></textarea>
            </div>
            
        </div>
    </div>
    
</div>

<script>
    const DEFAULT_START_HOUR = "11";
    const DEFAULT_START_MIN = "00";
    const DEFAULT_END_HOUR = "15";
    const DEFAULT_END_MIN = "00";

    window.onload = function() {
        const weekDays = ['일', '월', '화', '수', '목', '금', '토'];
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        
        const todayStr = `${y}-${m}-${d}`;
        document.getElementById('todayDate').innerText = `Today: ${todayStr} (${weekDays[today.getDay()]})`;
        document.getElementById('noticeDate').value = todayStr;

        const sh = document.getElementById('startHour');
        const eh = document.getElementById('endHour');
        const sm = document.getElementById('startMin');
        const em = document.getElementById('endMin');

        for(let i = 0; i < 24; i++) {
            let val = String(i).padStart(2, '0');
            sh.options.add(new Option(val + '시', val));
            eh.options.add(new Option(val + '시', val));
        }
        for(let i = 0; i < 60; i += 5) {
            let val = String(i).padStart(2, '0');
            sm.options.add(new Option(val + '분', val));
            em.options.add(new Option(val + '분', val));
        }
        
        sh.value = DEFAULT_START_HOUR; sm.value = DEFAULT_START_MIN;
        eh.value = DEFAULT_END_HOUR; em.value = DEFAULT_END_MIN;

        convertTime();
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    function getOffsetInfo(baseDate, offsetHours) {
        // 기준 시간에 Offset 시간을 안전하게 더함 (월 변경/연도 변경 시 자동 계산됨)
        const shifted = new Date(baseDate.getTime() + (offsetHours * 60 * 60 * 1000));
        return {
            dateStr: `${shifted.getUTCFullYear()}-${pad(shifted.getUTCMonth() + 1)}-${pad(shifted.getUTCDate())}`,
            timeStr: `${pad(shifted.getUTCHours())}:${pad(shifted.getUTCMinutes())}`
        };
    }

    function buildNoticeString(startInfo, endInfo) {
        if (startInfo.dateStr === endInfo.dateStr) {
            return `${startInfo.dateStr} ${startInfo.timeStr} ~ ${endInfo.timeStr}`;
        } else {
            return `${startInfo.dateStr} ${startInfo.timeStr} ~ ${endInfo.dateStr} ${endInfo.timeStr}`;
        }
    }

    let currentKstStr = "";
    let currentUtcZeroStr = "";
    let currentTargetStr = "";

    function convertTime() {
        const dateVal = document.getElementById('noticeDate').value;
        if (!dateVal) return;

        const sH = document.getElementById('startHour').value;
        const sM = document.getElementById('startMin').value;
        const eH = document.getElementById('endHour').value;
        const eM = document.getElementById('endMin').value;
        const targetOffset = parseFloat(document.getElementById('utcOffset').value);

        // KST 기준(UTC+9) Date 객체 생성
        const kstStart = new Date(`${dateVal}T${sH}:${sM}:00+09:00`);
        let kstEnd = new Date(`${dateVal}T${eH}:${eM}:00+09:00`);

        // 종료 시간이 시작 시간보다 빠르거나 같으면 익일로 처리
        if (kstEnd <= kstStart) {
            kstEnd = new Date(kstEnd.getTime() + (24 * 60 * 60 * 1000));
        }

        const startKst = getOffsetInfo(kstStart, 9);
        const endKst = getOffsetInfo(kstEnd, 9);
        const startUtcZero = getOffsetInfo(kstStart, 0);
        const endUtcZero = getOffsetInfo(kstEnd, 0);
        const startTarget = getOffsetInfo(kstStart, targetOffset);
        const endTarget = getOffsetInfo(kstEnd, targetOffset);

        currentKstStr = buildNoticeString(startKst, endKst);
        currentUtcZeroStr = `${buildNoticeString(startUtcZero, endUtcZero)} (UTC+0)`;
        
        let offsetSuffix = 'UTC+0';
        if (targetOffset > 0) offsetSuffix = `UTC+${targetOffset}`;
        if (targetOffset < 0) offsetSuffix = `UTC${targetOffset}`;
        currentTargetStr = `${buildNoticeString(startTarget, endTarget)} (${offsetSuffix})`;

        document.getElementById('kstResult').innerText = currentKstStr;
        document.getElementById('utcZeroResult').innerText = currentUtcZeroStr;
        document.getElementById('utcResult').innerText = currentTargetStr;
        
        const selectElem = document.getElementById('utcOffset');
        const selectedText = selectElem.options[selectElem.selectedIndex].text.split(' - ')[0];
        document.getElementById('targetLabel').innerText = `🌏 타겟 권역 (${selectedText.match(/\((.*?)\)/)[1]})`;
    }

    function insertTimeToEditor(type) {
        const editor = document.getElementById('sourceNotice');
        let insertText = "";
        
        if (type === 'KST') insertText = currentKstStr + " (KST)";
        else if (type === 'UTC0') insertText = currentUtcZeroStr;
        else if (type === 'UTCN') insertText = currentTargetStr;
        
        // 템플릿의 [점검시간삽입] 문자열이 있으면 통째로 치환, 없으면 커서 위치에 삽입
        if(editor.value.includes("[점검시간삽입]")) {
            editor.value = editor.value.replace("[점검시간삽입]", insertText);
        } else {
            const startPos = editor.selectionStart;
            const endPos = editor.selectionEnd;
            editor.value = editor.value.substring(0, startPos) + insertText + editor.value.substring(endPos, editor.value.length);
            editor.selectionStart = editor.selectionEnd = startPos + insertText.length;
        }
        editor.focus();
    }

    async function translateToEnglish() {
        let sourceText = document.getElementById('sourceNotice').value;
        const targetEditor = document.getElementById('targetNotice');
        const btn = document.getElementById('translateBtn');
        
        if (!sourceText.trim()) {
            alert('번역할 한국어 원문을 입력해주세요.');
            return;
        }

        // 로딩 UI 처리
        btn.disabled = true;
        btn.innerText = "⏳ 번역을 진행 중입니다...";
        targetEditor.value = "";

        // 게임명 오역 방지를 위한 사전 치환 처리
        sourceText = sourceText.replace(/린\s*크로니클/g, "Lyn Chronicle");

        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q=${encodeURIComponent(sourceText)}`;
            const response = await fetch(url);
            
            if (!response.ok) throw new Error('API 응답 오류');
            
            const data = await response.json();
            
            let translatedText = "";
            if (data && data[0]) {
                data[0].forEach(segment => {
                    if (segment[0]) translatedText += segment[0];
                });
            }
            
            // 번역 후 강제 보정 (Lyn이 Lynn 등으로 바뀌는 현상 원천 방지)
            translatedText = translatedText.replace(/Lynn Chronicle/gi, "Lyn Chronicle");
            translatedText = translatedText.replace(/Lin Chronicle/gi, "Lyn Chronicle");
            
            targetEditor.value = translatedText;
        } catch (error) {
            targetEditor.value = "⚠️ 번역 서버와 연결할 수 없습니다. 일시적인 네트워크 문제일 수 있으니 잠시 후 다시 시도해주세요.\n(" + error.message + ")";
        } finally {
            // UI 복구
            btn.disabled = false;
            btn.innerText = "🇬🇧 영문으로 자동 번역하기 ⬇️";
        }
    }

    function copyText(elementId) {
        const elem = document.getElementById(elementId);
        const text = elem.innerText || elem.value;
        
        if (text === '-' || !text) return;
        
        navigator.clipboard.writeText(text).then(() => {
            alert('클립보드에 복사되었습니다! (Ctrl+V로 붙여넣기)');
        }).catch(err => {
            alert('복사 권한이 없습니다. 텍스트를 직접 드래그해서 복사해주세요.');
        });
    }
</script>

</body>
</html>
